apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "easypharma.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "easypharma.selector" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "easypharma.selector" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- if .Values.postgres.enabled }}
      initContainers:
        # Le backend plante au démarrage si PostgreSQL ne répond pas encore : on l'attend ici plutôt que de compter
        # sur les redémarrages du pod. L'image de PostgreSQL fournit déjà pg_isready.
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h {{ .Release.Name }}-postgres -p 5432; do echo 'en attente de PostgreSQL'; sleep 2; done"]
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: DATABASE_URL
              value: "jdbc:postgresql://{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.database }}"
            - name: SPRING_DATA_REDIS_HOST
              value: "{{ .Release.Name }}-redis"
            {{- if .Values.rabbitmq.enabled }}
            - name: SPRING_RABBITMQ_HOST
              value: "{{ .Release.Name }}-rabbitmq"
            - name: SPRING_RABBITMQ_USERNAME
              value: {{ .Values.rabbitmq.username | quote }}
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: RABBITMQ_PASSWORD
            {{- end }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: JWT_SECRET
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DATABASE_PASSWORD
          # Les sondes utilisent les groupes de santé d'Actuator (management.endpoint.health.probes.enabled).
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.startupFailureThreshold }}
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
