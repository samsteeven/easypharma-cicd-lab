# Contrôles avant chaque commit : `pip install pre-commit && pre-commit install`.
# Même gitleaks que le workflow Sécurité, mais AVANT que le secret n'entre dans l'historique.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        files: Dockerfile
