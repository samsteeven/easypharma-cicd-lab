# Exceptions acceptées, une par composant, avec la raison. Tout le reste (HIGH et CRITICAL) fait échouer le contrôle.
# Ce sont des services de développement tiers : leurs images démarrent en root et écrivent dans leur propre système de
# fichiers. Les contraindre (utilisateur, volumes inscriptibles) demande de connaître chaque image : travail à faire,
# pas une absence de risque. Le backend, lui, n'a aucune exception.
misconfigurations:
  - id: KSV-0014
    paths:
      - deploy/helm/easypharma/templates/redis.yaml
      - deploy/helm/easypharma/templates/rabbitmq.yaml
      - deploy/helm/easypharma/templates/mailhog.yaml
      - deploy/helm/easypharma/templates/postgres.yaml
    statement: "Image tierce : système de fichiers en lecture seule non essayé (RabbitMQ et PostgreSQL écrivent hors de leurs volumes)."
  - id: KSV-0118
    paths:
      - deploy/helm/easypharma/templates/redis.yaml
      - deploy/helm/easypharma/templates/rabbitmq.yaml
      - deploy/helm/easypharma/templates/mailhog.yaml
      - deploy/helm/easypharma/templates/postgres.yaml
    statement: "Image tierce : utilisateur non root non essayé (UID propre à chaque image)."

# Failles de l'image (pipeline.yml). Une seule exception, datée : elle réapparaît à l'échéance.
vulnerabilities:
  - id: CVE-2026-47884
    expired_at: 2027-01-31
    statement: "spring-webmvc (XsltView, chemin mal limité) : aucun correctif publié pour Spring Framework 6.2 (corrigé seulement en 7.0.9, donc Spring Boot 4). Le code du backend n'utilise pas XsltView (aucune occurrence de « Xslt » dans src ni pom.xml). À revoir à la montée vers Spring Boot 4."
  - id: CVE-2026-47890
    expired_at: 2027-01-31
    statement: "spring-webmvc / spring-webflux (corruption du flux Server-Sent Events avec des fragments de vue) : aucun correctif publié pour Spring Framework 6.2 (corrigé seulement en 7.0.9, donc Spring Boot 4). Le backend n'utilise pas les SSE (aucune occurrence de SseEmitter, text/event-stream ni WebFlux dans src et pom.xml). À revoir à la montée vers Spring Boot 4."
